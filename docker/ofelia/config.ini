# ============================================================
# EcolPro — Ofelia (cron jobs, remplace Vercel Cron)
# ============================================================
#
# Les crons appellent les routes API en interne (localhost:3000)
# avec CRON_SECRET. Aucun endpoint public n'est exposé.
#
# Ofelia utilise docker-socket-proxy (DOCKER_HOST env) au lieu
# de monter /var/run/docker.sock directement.
# ============================================================

# --- Crons applicatifs (3) ---

[job-exec "dispatch-scheduled"]
schedule = "0 0 * * *"
container = "ecolpro-app"
command = sh -c "curl -sf -H 'Authorization: Bearer $${CRON_SECRET}' http://localhost:3000/api/cron/dispatch-scheduled"

[job-exec "relances-auto"]
schedule = "0 8 * * *"
container = "ecolpro-app"
command = sh -c "curl -sf -H 'Authorization: Bearer $${CRON_SECRET}' http://localhost:3000/api/cron/relances-auto"

[job-exec "purge-sites"]
schedule = "0 3 * * *"
container = "ecolpro-app"
command = sh -c "curl -sf -H 'Authorization: Bearer $${CRON_SECRET}' http://localhost:3000/api/cron/purge-sites"

# --- Backup pgBackRest ---

[job-exec "pgbackrest-backup"]
schedule = "0 2 * * *"
container = "ecolpro-pgbackrest"
command = sh -c "pgbackrest --stanza=ecolpro --type=incr backup && pgbackrest --stanza=ecolpro expire"

[job-exec "pgbackrest-full"]
schedule = "0 2 * * 0"
container = "ecolpro-pgbackrest"
command = sh -c "pgbackrest --stanza=ecolpro --type=full backup"

# --- Audit sécurité (hebdomadaire) ---

[job-exec "security-audit"]
schedule = "0 4 * * 1"
container = "ecolpro-app"
command = sh -c "curl -sf -H 'Authorization: Bearer $${CRON_SECRET}' http://localhost:3000/api/cron/security-audit"

# --- Test de restauration (hebdomadaire) ---

[job-exec "restore-test"]
schedule = "0 5 * * 6"
container = "ecolpro-pgbackrest"
command = sh -c "pgbackrest --stanza=ecolpro --type=time --target=$(date -u -d '1 hour ago' +%Y-%m-%d\ %H:%M:%S) --target-action=promote restore --dry-run && echo 'RESTORE_TEST_OK' || echo 'RESTORE_TEST_FAIL'"

# --- Nettoyage Docker (hebdomadaire) ---

[job-exec "docker-prune"]
schedule = "0 4 * * 0"
container = "ecolpro-app"
command = sh -c "docker system prune -f --volumes"
