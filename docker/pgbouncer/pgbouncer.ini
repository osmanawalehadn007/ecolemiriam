# ============================================================
# École Miriam — PgBouncer (mode transaction, compatible SET LOCAL)
# ============================================================

[databases]
ecolemiriam = host=postgres port=5432 dbname=ecolemiriam

[pgbouncer]
# --- Mode ---
listen_addr = 0.0.0.0
listen_port = 6432
pool_mode = transaction

# --- Connexions ---
# Calibré pour les heures de pointe (début de journée, rentrée scolaire).
# default_pool_size=40 : 40 connexions serveur vers PG (suffisant pour
#   30 connexions Prisma en vol + headroom).
# reserve_pool_size=10 : burst pour les pics de charge temporaires.
# max_client_conn=500 : largement au-dessus du connection_limit Prisma (30).
max_client_conn = 500
default_pool_size = 40
min_pool_size = 10
reserve_pool_size = 10
reserve_pool_timeout = 2
server_idle_timeout = 300
server_lifetime = 3600
client_idle_timeout = 0
client_login_timeout = 15
query_timeout = 30
query_wait_timeout = 30

# --- Sécurité ---
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
ignore_startup_parameters = extra_float_digits,search_path

# --- TLS interne (vers Postgres) ---
# server_tls_sslmode = disable (SSL disabled on postgres for now)

# --- Logging ---
log_connections = 1
log_disconnections = 1
log_pooler_errors = 1
stats_period = 60
admin_users = ecolemiriam_owner

# --- Performance ---
server_reset_query = DISCARD ALL
server_reset_query_always = 0
