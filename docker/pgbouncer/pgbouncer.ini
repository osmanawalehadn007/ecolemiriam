# ============================================================
# École Miriam — PgBouncer (mode transaction, compatible SET LOCAL)
# ============================================================

[databases]
ecolemiriam = host=postgres port=5432 dbname=ecolemiriam sslmode=require

[pgbouncer]
# --- Mode ---
listen_addr = 0.0.0.0
listen_port = 6432
pool_mode = transaction

# --- Connexions ---
max_client_conn = 200
default_pool_size = 20
min_pool_size = 5
reserve_pool_size = 5
reserve_pool_timeout = 3
server_idle_timeout = 300
server_lifetime = 3600
client_idle_timeout = 0
client_login_timeout = 15
query_timeout = 30
query_wait_timeout = 30

# --- Sécurité ---
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
ignore_startup_parameters = extra_float_digits,search_path

# --- TLS interne (vers Postgres) ---
server_tls_sslmode = require
server_tls_protocols = tlsv1.3

# --- Logging ---
log_connections = 1
log_disconnections = 1
log_pooler_errors = 1
stats_period = 60
admin_users = ecolemiriam_owner

# --- Performance ---
server_reset_query = DISCARD ALL
server_reset_query_always = 0
