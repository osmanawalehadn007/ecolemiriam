# ============================================================
# École Miriam — postgresql.conf (durci pour production VPS)
# ============================================================

# --- Identité ---
cluster_name = 'ecolemiriam-prod'
data_directory = '/var/lib/postgresql/data'
hba_file = '/etc/postgresql/pg_hba.conf'
ident_file = '/var/lib/postgresql/ident.conf'

# --- Connexions ---
# 150 connexions : PgBouncer (40+10 reserve) + admin + backups + headroom.
# Calibré pour les heures de pointe (début de journée, rentrée scolaire).
listen_addresses = '*'
port = 5432
max_connections = 150
superuser_reserved_connections = 3

# --- Authentification ---
password_encryption = scram-sha-256
ssl = off

# --- Mémoire (calibré pour conteneur 4 Go, heures de pointe) ---
# shared_buffers 1GB (~25% du quota cgroup) : cache hit ratio correct
#   sans risquer l'OOM du conteneur.
# effective_cache_size 2560MB : reflette le cache OS réaliste disponible
#   (quota 4 Go - shared_buffers 1 Go - overhead). Évite que le
#   planificateur ne suppose un cache inexistant et choisisse des plans
#   trop optimistes sur les requêtes lourdes.
# work_mem 8MB : 150 connexions × ops de tri/hachage simultanés →
#   headroom suffistant sous le quota restant (~1.5 Go).
shared_buffers = 1GB
effective_cache_size = 2560MB
work_mem = 8MB
maintenance_work_mem = 128MB
wal_buffers = 16MB

# --- WAL & Checkpoint (optimisé pour PITR) ---
wal_level = replica
max_wal_size = 2GB
min_wal_size = 256MB
checkpoint_timeout = 15min
checkpoint_completion_target = 0.9
archive_mode = on

# --- Requêtes ---
random_page_cost = 1.1
effective_io_concurrency = 200
default_statistics_target = 100
track_activities = on
track_io_timing = on

# --- Logging (sécurité & audit) ---
log_destination = 'stderr'
logging_collector = off
log_min_messages = warning
log_min_error_statement = error
log_connections = on
log_disconnections = on
log_duration = off
log_line_prefix = '%m [%p] %u@%d %h '
log_statement = 'ddl'
log_timezone = 'UTC'

# --- pgaudit ---
shared_preload_libraries = 'pg_stat_statements'
pgaudit.log = 'write,ddl,role'
pgaudit.log_catalog = off
pgaudit.log_parameter = on
pgaudit.log_relation = on
pgaudit.role = 'pgaudit_log'

# --- pg_stat_statements ---
pg_stat_statements.max = 10000
pg_stat_statements.track = all

# --- Performance ---
autovacuum = on
autovacuum_max_workers = 3
autovacuum_naptime = 30s
autovacuum_vacuum_threshold = 50
autovacuum_analyze_threshold = 50

# --- Timeouts (protection contre les requêtes orphelines) ---
statement_timeout = 30s
idle_in_transaction_session_timeout = 60s
lock_timeout = 10s
# connection_timeout is a client-side parameter, not server-side

# --- Sécurité ---
row_security = on
default_transaction_isolation = 'read committed'

# --- Locales ---
lc_messages = 'en_US.utf8'
lc_monetary = 'en_US.utf8'
lc_numeric = 'en_US.utf8'
lc_time = 'en_US.utf8'
timezone = 'UTC'
archive_command = 'test ! -f /var/lib/postgresql/wal/archive/%f && cp %p /var/lib/postgresql/wal/archive/%f'
