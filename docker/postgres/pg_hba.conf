# ============================================================
# École Miriam — pg_hba.conf (contrôle d'accès strict, scram-sha-256)
# ============================================================
# FORMAT : TYPE  DATABASE  USER  ADDRESS  METHOD
#
# Règles : du plus restrictif au moins restrictif.
# scram-sha-256 partout, jamais trust/md5.
# ============================================================

# --- Local (socket Unix, pour les scripts internes) ---
local   all             postgres                                peer
local   all             all                                     scram-sha-256

# --- Réseau Docker interne (backend, 172.x.x.x) ---
# PgBouncer → Postgres (rôle ecolemiriam_app)
hostssl ecolemiriam         ecolemiriam_app      172.0.0.0/8            scram-sha-256

# Owner → Postgres (rôle ecolemiriam_owner, pour migrations Prisma)
hostssl ecolemiriam         ecolemiriam_owner    172.0.0.0/8            scram-sha-256

# pgBackRest → Postgres (rôle postgres, pour backup)
hostssl all             postgres         172.0.0.0/8            scram-sha-256

# --- Tout le reste : REFUSÉ ---
host    all             all             0.0.0.0/0               reject
host    all             all             ::/0                    reject
