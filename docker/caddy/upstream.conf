# Auto-généré par blue-green-deploy.sh — ne pas éditer manuellement
# Slot actif : blue (initial)
# Ce fichier est importé par Caddyfile via `import upstream.conf`
# Il contient le bloc reverse_proxy complet avec health checks + headers
reverse_proxy app-blue:3000 {
    health_uri /api/health
    health_interval 30s
    health_timeout 5s
    health_status 2xx
    transport http {
        read_timeout 60s
        write_timeout 60s
        dial_timeout 5s
    }
    header_up Host {host}
    header_up X-Real-IP {remote_host}
    header_up X-Forwarded-For {remote_host}
    header_up X-Forwarded-Proto https
}
