# ============================================================
# École Miriam — docker-compose GCP (app-only, DB sur Supabase)
# ============================================================
#
# Architecture réseau :
#
#   Internet → Cloudflare (WAF/DDoS) → Cloudflare Tunnel → GCP VM
#                                                          ↓
#                                                        Caddy (TLS interne, headers, rate limit)
#                                                          ↓
#                                                        app (Next.js standalone)
#                                                          ↓
#                                                        Supabase (Postgres + Pooler, managed)
#
# Différences avec docker-compose.yml (VPS) :
#   - PAS de postgres (Supabase gère la DB)
#   - PAS de pgbouncer (Supabase pooler gère le pooling)
#   - PAS de pgbackrest (Supabase gère les backups)
#   - PAS de réseau backend (tout sur frontend)
#   - PAS de secrets postgres (mots de passe dans .env.production)
#
# Réseaux Docker :
#   - frontend : tous les conteneurs (peut sortir vers Internet/Supabase)
# ============================================================

services:
  # ============================================================
  # REDIS — Cache partagé + sessions invalidables + queues
  # ============================================================
  redis:
    image: redis:7-alpine
    container_name: ecolemiriam-redis
    restart: unless-stopped

    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
      - DAC_OVERRIDE
      - CHOWN
    mem_limit: 384m
    pids_limit: 100

    networks:
      - frontend

    env_file:
      - ../.env.production

    command: >
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --requirepass ${REDIS_PASSWORD:-ecolemiriam_redis_dev}

    volumes:
      - redis-data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-ecolemiriam_redis_dev}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================================
  # APP — Next.js (standalone, non-root, read-only rootfs)
  # ============================================================
  # Architecture Blue-Green : deux conteneurs (app-blue, app-green),
  # un seul actif à la fois. Caddy bascule entre les deux via
  # caddy/upstream.conf (géré par blue-green-deploy.sh).
  # ============================================================

  x-app-base: &app-base
    image: ghcr.io/wilsan007/ecolemiriam-app:latest
    restart: unless-stopped

    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 1.5g
    memswap_limit: 1.5g
    pids_limit: 200
    tmpfs:
      - /tmp:size=64M,mode=1777
      - /home/nextjs:size=16M,mode=1777
      - /app/.next/cache:size=256M,mode=0777

    networks:
      - frontend

    depends_on:
      redis:
        condition: service_healthy

    env_file:
      - ../.env.production

    environment:
      NODE_ENV: production
      RLS_ACTIVE: "true"
      AUTH_TRUST_HOST: "true"

    expose:
      - "3000"

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  app-blue:
    <<: *app-base
    container_name: ecolemiriam-app-blue

  app-green:
    <<: *app-base
    container_name: ecolemiriam-app-green

  # ============================================================
  # CADDY — Reverse proxy (TLS interne, security headers, rate limit)
  # ============================================================
  caddy:
    build:
      context: ./caddy
      dockerfile: Dockerfile
    image: ecolemiriam-caddy:latest
    container_name: ecolemiriam-caddy
    restart: unless-stopped

    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    mem_limit: 256m
    pids_limit: 100

    networks:
      - frontend

    depends_on:
      app-blue:
        condition: service_healthy

    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/upstream.conf:/etc/caddy/upstream.conf:ro
      - ./caddy/upstream-simple.conf:/etc/caddy/upstream-simple.conf:ro
      - caddy-data:/data
      - caddy-config:/config

    expose:
      - "8080"
      - "8081"

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================================
  # CLOUDFLARED — Tunnel (zero-trust, token-based, aucun port entrant)
  # ============================================================
  cloudflared:
    image: cloudflare/cloudflared:2025.8.0
    container_name: ecolemiriam-cloudflared
    restart: unless-stopped

    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - DAC_READ_SEARCH
    mem_limit: 128m
    pids_limit: 50

    networks:
      - frontend

    depends_on:
      caddy:
        condition: service_started

    command: tunnel --config /etc/cloudflared/config.yml run

    environment:
      TUNNEL_TOKEN_FILE: /run/secrets/cloudflare_tunnel_token

    volumes:
      - ./cloudflared/config.yml:/etc/cloudflared/config.yml:ro

    secrets:
      - cloudflare_tunnel_token

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================================
  # DOCKER-SOCKET-PROXY — Proxy sécurisé pour le socket Docker
  # ============================================================
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:0.3.0
    container_name: ecolemiriam-docker-socket-proxy
    restart: unless-stopped

    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 64m
    pids_limit: 50

    networks:
      - frontend

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

    environment:
      CONTAINERS: 1
      EXEC: 1
      INFO: 1
      POST: 1
      BUILD: 0
      COMMIT: 0
      CONFIGS: 0
      DISTRIBUTION: 0
      EVENTS: 0
      IMAGES: 0
      NETWORKS: 0
      NODES: 0
      PLUGINS: 0
      SECRETS: 0
      SERVICES: 0
      SESSION: 0
      SWARM: 0
      SYSTEM: 0
      TASKS: 0
      VOLUMES: 0

    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  # ============================================================
  # OFELIA — Cron jobs (remplace Vercel Cron)
  # ============================================================
  ofelia:
    image: mcuadros/ofelia:latest
    container_name: ecolemiriam-ofelia
    restart: unless-stopped

    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 128m
    pids_limit: 50

    networks:
      - frontend

    depends_on:
      app-blue:
        condition: service_healthy
      docker-socket-proxy:
        condition: service_started

    volumes:
      - ./ofelia/config.ini:/etc/ofelia/config.ini:ro

    environment:
      DOCKER_HOST: tcp://docker-socket-proxy:2375

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================================
  # UPTIME KUMA — Monitoring & alertes
  # ============================================================
  monitoring:
    image: louislam/uptime-kuma:1.23.16-alpine
    container_name: ecolemiriam-monitoring
    restart: unless-stopped

    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    pids_limit: 100

    networks:
      - frontend

    volumes:
      - monitoring-data:/app/data

    expose:
      - "3001"

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

# ============================================================
# RÉSEAUX
# ============================================================
networks:
  frontend:
    driver: bridge

# ============================================================
# VOLUMES
# ============================================================
volumes:
  caddy-data:
  caddy-config:
  monitoring-data:
  redis-data:

# ============================================================
# SECRETS
# ============================================================
secrets:
  cloudflare_tunnel_token:
    file: ./secrets/cloudflare_tunnel_token.txt
