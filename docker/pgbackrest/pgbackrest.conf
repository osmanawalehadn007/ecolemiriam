# ============================================================
# École Miriam — pgBackRest (PITR, sauvegardes incrémentales, offsite R2)
# ============================================================

[ecolemiriam]
pg1-host = postgres
pg1-port = 5432
pg1-user = postgres
pg1-database = ecolemiriam
pg1-path = /var/lib/postgresql/data

# --- Répository de sauvegarde local ---
repo1-path = /var/lib/pgbackrest
repo1-retention-full = 4
repo1-retention-diff = 4
repo1-retention-incr = 14
repo1-bundle = y
repo1-cipher-type = aes-256-cbc
repo1-cipher-pass = ${PGBACKREST_CIPHER_PASS}

# --- Compression ---
repo1-compress-type = zst
repo1-compress-level = 3

# --- Archivage WAL ---
archive-timeout = 60
archive-get-queue-max = 1GiB

# --- Parallelisme ---
process-max = 2

# --- Logging ---
log-level-console = info
log-level-file = debug
log-path = /var/log/pgbackrest

# --- PITR ---
start-fast = y
delta = y

# --- Offsite R2 (optionnel, décommenter après configuration) ---
# repo2-type = s3
# repo2-s3-endpoint = https://<account_id>.r2.cloudflarestorage.com
# repo2-s3-bucket = ecolemiriam-backups
# repo2-s3-region = auto
# repo2-s3-key = REMPLACER_PAR_R2_ACCESS_KEY
# repo2-s3-key-secret = REMPLACER_PAR_R2_SECRET_KEY
