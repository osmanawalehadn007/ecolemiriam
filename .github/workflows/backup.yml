name: Backup — pg_dump chiffré + upload off-site

on:
  schedule:
    # Quotidien à 02h00 UTC
    - cron: "0 2 * * *"
  workflow_dispatch: {}

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Le runner Ubuntu fournit postgresql-client-16, alors que la base
      # Supabase tourne en 17.x. pg_dump refuse de sauvegarder un serveur plus
      # récent que lui (« aborting because of server version mismatch ») : un
      # dump produit par un client plus ancien pourrait être incomplet. On
      # installe donc le client 17 depuis le dépôt PGDG.
      # À faire évoluer si Supabase passe en 18.
      - name: Install postgresql-client 17
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
          /usr/lib/postgresql/17/bin/pg_dump --version

      - name: Install age + rclone
        run: |
          wget -qO- https://github.com/FiloSottile/age/releases/download/v1.2.1/age-v1.2.1-linux-amd64.tar.gz | tar xzf - -C /tmp
          sudo mv /tmp/age/age /tmp/age/age-keygen /usr/local/bin/
          curl https://rclone.org/install.sh | sudo bash

      - name: Configure rclone
        env:
          RCLONE_CONFIG: ${{ secrets.BACKUP_RCLONE_CONFIG }}
        run: |
          mkdir -p ~/.config/rclone
          echo "$RCLONE_CONFIG" > ~/.config/rclone/rclone.conf
          rclone listremotes

      - name: Run encrypted backup
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          BACKUP_AGE_KEY: ${{ secrets.BACKUP_AGE_KEY }}
          BACKUP_RCLONE_REMOTE: ecolemiriam-backup
          BACKUP_RETENTION_DAYS: "30"
        run: |
          chmod +x scripts/backups/backup.sh
          ./scripts/backups/backup.sh

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::La sauvegarde a échoué. Vérifiez les logs et les secrets."
          exit 1
