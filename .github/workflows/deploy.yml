name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: # Déclenchement manuel possible

# Éviter deux déploiements simultanés sur le VPS
concurrency:
  group: deploy-vps
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/ecolemiriam-app

jobs:
  # ============================================================
  # JOB 1 : Build de l'image Docker + push vers GHCR
  # ============================================================
  # Se fait sur un runner GitHub Actions (4 vCPU, 16 Go RAM) —
  # bien plus rapide que builder sur le VPS (1-2 vCPU, 2-4 Go RAM).
  # Cache BuildKit via GHCR : les builds incrémentaux sont ~2-3x plus rapides.
  # ============================================================
  build-and-push:
    name: Build & Push to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # Permet de push vers GHCR

    outputs:
      image_digest: ${{ steps.build.outputs.digest }}
      image_tag: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }} # Token automatique, pas besoin de secret manuel

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short
            type=ref,event=branch

      - name: Build & Push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/app/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Cache distant via GHCR : accélère les builds incrémentaux
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:cache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:cache,mode=max
          provenance: true
          sbom: true # Software Bill of Materials pour la sécurité

  # ============================================================
  # JOB 2 : Déploiement sur le VPS
  # ============================================================
  # SSH vers le VPS, pull la nouvelle image, restart, healthcheck.
  # Le VPS ne build plus — il pull une image pré-construite.
  # Durée : ~30-60s (pull + restart + healthcheck) au lieu de ~10-15min.
  # ============================================================
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production # Protection rule optionnelle (approval manuelle possible)

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          # La clé SSH est restreinte (authorized_keys) à ci-deploy.sh qui fait :
          #   1. git pull (récupère docker-compose.yml + scripts à jour)
          #   2. docker login GHCR
          #   3. deploy.sh (backup + pull image + restart + healthcheck + rollback auto)
          script: /opt/ecolemiriam/docker/scripts/ci-deploy.sh
