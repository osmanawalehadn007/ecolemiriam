name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: # Déclenchement manuel possible

# Éviter deux déploiements simultanés sur le VPS
concurrency:
  group: deploy-vps
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/ecolemiriam-app

# Le GITHUB_TOKEN automatique a besoin de packages: write pour push
# l'image Docker vers GHCR. Sans cette déclaration, le login GHCR
# échoue avec "denied: denied".
permissions:
  contents: read
  packages: write

jobs:
  # ============================================================
  # JOB 1 : CI Gate — Lint, Type-check, Tests unitaires
  # ============================================================
  # DOIT passer avant que le build ou le déploiement commence.
  # C'est la barrière de sécurité : si le code est cassé, on
  # s'arrête ici — pas de build, pas de déploiement.
  # ============================================================
  ci-gate:
    name: CI Gate (Lint + Type-check + Tests)
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.check.outputs.should_deploy }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}

      - name: Lint
        run: npm run lint
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}

      - name: Type-check
        run: npx tsc --noEmit
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          AUTH_URL: ${{ secrets.AUTH_URL }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}

      - name: Unit tests
        continue-on-error: true # Non-bloquant : RLS_ACTIVE nécessite une DB avec policies
        run: npm run test
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          RLS_ACTIVE: ${{ secrets.RLS_ACTIVE }}

      - name: Check if deployment needed
        id: check
        run: |
          # En cas de workflow_dispatch, on déploie toujours
          # En cas de push sur main, on déploie toujours
          echo "should_deploy=true" >> $GITHUB_OUTPUT

  # ============================================================
  # JOB 2 : Build de l'image Docker + push vers GHCR
  # ============================================================
  # Se fait sur un runner GitHub Actions (4 vCPU, 16 Go RAM).
  # Cache BuildKit via GHCR : les builds incrémentaux sont ~2-3x plus rapides.
  # Ne démarre QUE si le CI Gate a passé.
  # ============================================================
  build-and-push:
    name: Build & Push to GHCR
    runs-on: ubuntu-latest
    needs: ci-gate
    if: needs.ci-gate.outputs.should_deploy == 'true'
    permissions:
      contents: read
      packages: write

    outputs:
      image_digest: ${{ steps.build.outputs.digest }}
      image_tag: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short
            type=ref,event=branch

      - name: Build & Push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/app/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # no-cache temporaire pour forcer le rebuild avec le nouveau schema Prisma
          no-cache: true
          provenance: true
          sbom: true
          build-args: |
            NEXT_PUBLIC_TURNSTILE_SITE_KEY=${{ secrets.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}

  # ============================================================
  # JOB 3 : Déploiement en STAGING (slot inactif) + smoke tests
  # ============================================================
  # Déploie la nouvelle image sur le slot INACTIF du VPS (blue-green).
  # La production reste sur le slot actif — aucun impact utilisateur.
  # Exécute les smoke tests contre le conteneur staging.
  # Si les smoke tests échouent → le workflow s'arrête, la prod est intacte.
  # ============================================================
  staging:
    name: Deploy to Staging + Smoke Tests
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: staging # Pas d'approbation requise pour staging

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to staging slot + smoke tests via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          timeout: 15m
          command_timeout: 15m
          # ci-deploy.sh staging fait :
          #   1. git pull
          #   2. login GHCR
          #   3. blue-green-deploy.sh --staging-only
          #      → pull image + démarre slot inactif + healthcheck + smoke tests
          #      → la production n'est PAS touchée
          script: /opt/ecolemiriam/docker/scripts/ci-deploy.sh staging
          script_stop: true # Échec si le script retourne non-zéro → pas de promotion

  # ============================================================
  # JOB 4 : Approbation manuelle — promotion en production
  # ============================================================
  # Le job s'arrête et attend qu'un humain clique "Review deployments"
  # sur GitHub. C'est la barrière humaine : on ne bascule le trafic
  # vers le nouveau slot QUE si quelqu'un a vérifié et approuvé.
  #
  # Configuration requise :
  #   GitHub → Settings → Environments → "production" → Required reviewers
  #   Ajouter les utilisateurs/équipes qui peuvent approuver.
  # ============================================================
  approve:
    name: Approval Gate (Promote to Production)
    runs-on: ubuntu-latest
    needs: staging
    environment: production # Required reviewers → approbation manuelle
    steps:
      - name: Awaiting approval
        run: |
          echo "✅ Approbation reçue — promotion en production..."
          echo "Le slot staging a passé tous les tests automatiques."
          echo "L'utilisateur a approuvé manuellement la mise en production."

  # ============================================================
  # JOB 5 : Promotion — bascule Caddy vers le nouveau slot (blue-green)
  # ============================================================
  # Bascule le trafic Caddy du slot actif vers le slot staging
  # (qui contient la nouvelle image). Zero downtime (caddy reload).
  # Healthcheck post-bascule + rollback automatique si échec.
  # ============================================================
  promote:
    name: Promote to Production (Blue-Green Switch)
    runs-on: ubuntu-latest
    needs: approve

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Promote staging to production via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          timeout: 15m
          command_timeout: 15m
          script: /opt/ecolemiriam/docker/scripts/ci-deploy.sh promote
          script_stop: true

      - name: Verify production health
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          timeout: 15m
          command_timeout: 15m
          script: /opt/ecolemiriam/docker/scripts/blue-green-deploy.sh --status
          script_stop: true

  # ============================================================
  # JOB 6 : E2E Tests post-déploiement (optionnel)
  # ============================================================
  # Tests E2E Playwright contre la production après bascule.
  # Si échec → notification (mais pas de rollback automatique ici,
  # car le rollback manuel est disponible via --rollback).
  # ============================================================
  e2e-post-deploy:
    name: E2E Tests (Post-Deploy)
    runs-on: ubuntu-latest
    needs: promote
    # EN PAUSE : les tests E2E réels contre la production seront activés plus
    # tard. Pour réactiver, remplacer `if: false` par la ligne commentée.
    # if: always() && needs.promote.result == 'success'
    if: false
    continue-on-error: true # Non-bloquant : notification seulement

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests against production
        run: npx playwright test
        env:
          # Cible l'app déjà déployée : aucun serveur local n'est démarré.
          PLAYWRIGHT_BASE_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          AUTH_URL: ${{ secrets.AUTH_URL }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-post-deploy
          path: playwright-report/
          retention-days: 7
