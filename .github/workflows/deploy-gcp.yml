name: Build & Deploy (GCP)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-gcp
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/ecolemiriam-app
  GCP_PROJECT: ecole-miriam
  GCP_ZONE: us-central1-a
  GCP_INSTANCE: ecolpro-prod
  WIF_PROVIDER: projects/994656035611/locations/global/workloadIdentityPools/github-pool/providers/github-provider
  SA_EMAIL: github-actions-deploy@ecole-miriam.iam.gserviceaccount.com

permissions:
  contents: read
  packages: write
  id-token: write # Requis pour Workload Identity Federation

jobs:
  # ============================================================
  # JOB 1 : CI Gate — Lint, Type-check, Tests unitaires
  # ============================================================
  ci-gate:
    name: CI Gate (Lint + Type-check + Tests)
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.check.outputs.should_deploy }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}

      - name: Lint
        run: npm run lint
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}

      - name: Type-check
        run: npx tsc --noEmit
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          AUTH_URL: ${{ secrets.AUTH_URL }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}

      - name: Unit tests
        continue-on-error: true
        run: npm run test
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          RLS_ACTIVE: ${{ secrets.RLS_ACTIVE }}

      - name: Check if deployment needed
        id: check
        run: echo "should_deploy=true" >> $GITHUB_OUTPUT

  # ============================================================
  # JOB 2 : Build de l'image Docker + push vers GHCR
  # ============================================================
  build-and-push:
    name: Build & Push to GHCR
    runs-on: ubuntu-latest
    needs: ci-gate
    if: needs.ci-gate.outputs.should_deploy == 'true'
    permissions:
      contents: read
      packages: write

    outputs:
      image_digest: ${{ steps.build.outputs.digest }}
      image_tag: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short
            type=ref,event=branch

      - name: Build & Push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/app/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          no-cache: true
          provenance: true
          sbom: true
          build-args: |
            NEXT_PUBLIC_TURNSTILE_SITE_KEY=${{ secrets.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}

  # ============================================================
  # JOB 3 : Déploiement en STAGING (slot inactif) + smoke tests
  # ============================================================
  # Utilise gcloud compute ssh --tunnel-through-iap pour se connecter
  # à la VM GCP via Identity-Aware Proxy (pas de SSH public).
  # ============================================================
  staging:
    name: Deploy to Staging (GCP) + Smoke Tests
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: staging

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to GCP (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.SA_EMAIL }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to staging slot via IAP
        run: |
          gcloud compute ssh ${{ env.GCP_INSTANCE }} \
            --zone=${{ env.GCP_ZONE }} \
            --project=${{ env.GCP_PROJECT }} \
            --tunnel-through-iap \
            --command="/opt/ecolemiriam/docker/scripts/ci-deploy-gcp.sh staging"

  # ============================================================
  # JOB 4 : Approbation manuelle — promotion en production
  # ============================================================
  approve:
    name: Approval Gate (Promote to Production)
    runs-on: ubuntu-latest
    needs: staging
    environment: production
    steps:
      - name: Awaiting approval
        run: |
          echo "✅ Approbation reçue — promotion en production..."
          echo "Le slot staging a passé tous les tests automatiques."

  # ============================================================
  # JOB 5 : Promotion — bascule Caddy vers le nouveau slot
  # ============================================================
  promote:
    name: Promote to Production (GCP Blue-Green Switch)
    runs-on: ubuntu-latest
    needs: approve

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to GCP (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.SA_EMAIL }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Promote staging to production via IAP
        run: |
          gcloud compute ssh ${{ env.GCP_INSTANCE }} \
            --zone=${{ env.GCP_ZONE }} \
            --project=${{ env.GCP_PROJECT }} \
            --tunnel-through-iap \
            --command="/opt/ecolemiriam/docker/scripts/ci-deploy-gcp.sh promote"

      - name: Verify production health
        run: |
          gcloud compute ssh ${{ env.GCP_INSTANCE }} \
            --zone=${{ env.GCP_ZONE }} \
            --project=${{ env.GCP_PROJECT }} \
            --tunnel-through-iap \
            --command="/opt/ecolemiriam/docker/scripts/blue-green-deploy-gcp.sh --status"
