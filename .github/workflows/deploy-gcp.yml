name: Build & Deploy (GCP)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      promote:
        description: "Promouvoir le slot staging en production"
        type: boolean
        default: false

concurrency:
  group: deploy-gcp
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/ecolemiriam-app
  GCP_PROJECT: ecole-miriam
  GCP_ZONE: us-central1-a
  GCP_INSTANCE: ecolpro-prod
  WIF_PROVIDER: projects/994656035611/locations/global/workloadIdentityPools/github-pool/providers/github-provider
  SA_EMAIL: github-actions-deploy@ecole-miriam.iam.gserviceaccount.com

permissions:
  contents: read
  packages: write
  id-token: write # Requis pour Workload Identity Federation

jobs:
  # ============================================================
  # JOB 1 : CI Gate — Lint, Type-check, Tests unitaires
  # ============================================================
  ci-gate:
    name: CI Gate (Lint + Type-check + Tests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Node 24 LTS (krypton) : jsdom 30 exige `^22.22.2 || ^24.15.0` et undici 8
      # `>=22.19.0`, pour `worker_threads.markAsUncloneable` absent de Node 20.
      # Sous Node 20, tous les workers vitest meurent au démarrage sur
      # « webidl.util.markAsUncloneable is not a function » et aucun test ne
      # s'exécute. 24 est aussi la version de l'image docker/app/Dockerfile.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}

      - name: Lint
        run: npm run lint
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}

      - name: Type-check
        run: npx tsc --noEmit
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          AUTH_URL: ${{ secrets.AUTH_URL }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}

      - name: Unit tests
        run: npm run test
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          RLS_ACTIVE: ${{ secrets.RLS_ACTIVE }}

      # ── Audit de sécurité des dépendances (npm audit) ──────────────────
      # Bloque le CI si une vulnérabilité de niveau high ou critical est
      # détectée dans les dépendances. Les vulnérabilités moderate et low
      # sont affichées mais ne bloquent pas (continue-on-error: false sur
      # --audit-level=high uniquement).
      - name: Dependency audit (high+)
        run: npm audit --audit-level=high
        continue-on-error: false

      # ── Garde-fous de dépôt (cible de déploiement, secrets, doc env) ────
      # Les mêmes contrôles que le job `garde-fous` de ci.yml, rejoués ici : un
      # push direct sur main ne passe pas par la CI de PR.
      - name: Garde-fous (cible, secrets, documentation)
        run: |
          node scripts/ci/check-deploy-target.mjs
          node scripts/ci/scan-secrets.mjs
          node scripts/ci/check-env-docs.mjs

      # ── SAST : Semgrep scan ─────────────────────────────────────────────
      # Analyse statique du code pour détecter les vulnérabilités OWASP
      # Top 10 (injection, XSS, path traversal, secrets hardcodés, etc.).
      # Utilise l'autoconfig de Semgrep (règles par défaut + p/owasp).
      - name: Semgrep SAST scan
        uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            p/owasp-top-ten
            p/typescript
            p/react
          generateSarif: "1"
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

  # ============================================================
  # JOB 2 : Build de l'image Docker + push vers GHCR
  # ============================================================
  build-and-push:
    name: Build & Push to GHCR
    runs-on: ubuntu-latest
    needs: ci-gate
    permissions:
      contents: read
      packages: write

    outputs:
      image_digest: ${{ steps.build.outputs.digest }}
      image_tag: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short
            type=ref,event=branch

      - name: Build & Push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/app/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          no-cache: true
          provenance: true
          sbom: true
          build-args: |
            NEXT_PUBLIC_TURNSTILE_SITE_KEY=${{ secrets.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}

  # ============================================================
  # JOB 3 : Déploiement en STAGING (slot inactif) + smoke tests
  # ============================================================
  # Utilise gcloud compute ssh --tunnel-through-iap pour se connecter
  # à la VM GCP via Identity-Aware Proxy (pas de SSH public).
  # ============================================================
  staging:
    name: Deploy to Staging (GCP) + Smoke Tests
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: staging

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to GCP (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.SA_EMAIL }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      # Le dépôt de la VM est synchronisé ici, et non par ci-deploy-gcp.sh :
      # ce dernier vit dans /opt/ecolemiriam, et un `git pull` lancé depuis lui
      # réécrirait le fichier que bash est en train de lire. Les commandes sont
      # passées en argument plutôt que rangées dans un script de /opt, pour
      # qu'aucun fichier ne se modifie pendant qu'il s'exécute.
      - name: Sync code on VM
        run: .github/scripts/ssh-retry.sh 'cd /opt/ecolemiriam && S=0; { git diff --quiet && git diff --cached --quiet; } || { git stash push -m ci-sync && S=1; }; git fetch origin main && git merge --ff-only origin/main; RC=$?; [ "$S" = 0 ] || git stash pop; exit $RC'

      - name: Deploy to staging slot via IAP
        run: .github/scripts/ssh-retry.sh 'CI_SKIP_GIT_SYNC=1 /opt/ecolemiriam/docker/scripts/ci-deploy-gcp.sh staging'

  # ============================================================
  # JOB 4 : Approbation manuelle — promotion en production
  # ============================================================
  # Les règles de protection d'environnement (reviewers requis) demandent
  # GitHub Pro sur un dépôt privé. À défaut, la porte est ici : la promotion
  # n'a lieu que sur un lancement manuel avec l'entrée `promote` cochée. Un
  # push sur main s'arrête donc au staging, jamais en production.
  approve:
    name: Approval Gate (Promote to Production)
    runs-on: ubuntu-latest
    needs: staging
    if: github.event_name == 'workflow_dispatch' && inputs.promote
    environment: production
    steps:
      - name: Awaiting approval
        run: |
          echo "✅ Promotion demandée explicitement par ${{ github.actor }}."
          echo "Le slot staging a passé tous les tests automatiques."

  # ============================================================
  # JOB 5 : Promotion — bascule Caddy vers le nouveau slot
  # ============================================================
  promote:
    name: Promote to Production (GCP Blue-Green Switch)
    runs-on: ubuntu-latest
    needs: approve

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to GCP (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.SA_EMAIL }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      # Le dépôt de la VM est synchronisé ici, et non par ci-deploy-gcp.sh :
      # ce dernier vit dans /opt/ecolemiriam, et un `git pull` lancé depuis lui
      # réécrirait le fichier que bash est en train de lire. Les commandes sont
      # passées en argument plutôt que rangées dans un script de /opt, pour
      # qu'aucun fichier ne se modifie pendant qu'il s'exécute.
      - name: Sync code on VM
        run: .github/scripts/ssh-retry.sh 'cd /opt/ecolemiriam && S=0; { git diff --quiet && git diff --cached --quiet; } || { git stash push -m ci-sync && S=1; }; git fetch origin main && git merge --ff-only origin/main; RC=$?; [ "$S" = 0 ] || git stash pop; exit $RC'

      - name: Promote staging to production via IAP
        run: .github/scripts/ssh-retry.sh 'CI_SKIP_GIT_SYNC=1 /opt/ecolemiriam/docker/scripts/ci-deploy-gcp.sh promote'

      - name: Verify production health
        run: .github/scripts/ssh-retry.sh '/opt/ecolemiriam/docker/scripts/blue-green-deploy-gcp.sh --status'
